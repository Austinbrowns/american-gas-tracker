name: Daily gas-price pipeline

on:
  schedule:
    # AAA says its page is refreshed around 3 a.m. Eastern; this is safely after that in UTC.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch, rebuild, publish status, and open Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pipeline.py
      - name: Verify today’s complete snapshot
        run: python -m tracker.health
      - name: Commit the daily data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/status.json data/issue.md data/raw
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily gas-price snapshot $(date -u +%F)"
            git push
          fi

  pages-build:
    needs: daily
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          cp data/history.csv data/status.json _site/data/
      - name: Validate static site artifact
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/browse.html
          test -s _site/trends.html
          test -s _site/data/history.csv
          test -s _site/data/status.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5

