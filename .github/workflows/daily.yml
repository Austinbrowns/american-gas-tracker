name: Daily gas-price pipeline

on:
  schedule:
    # AAA says its page is refreshed around 3 a.m. Eastern; this is safely after that in UTC.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch, rebuild, publish status, and open Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pipeline.py
      - name: Commit the daily data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/status.json data/issue.md data/raw
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily gas-price snapshot $(date -u +%F)"
            git push
          fi

